[workspace]
members = [
    "backend",
    "frontend",
]
default-members = ["backend"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "A starter for a backend in Actix Web"
readme = "README.md"
repository = "https://github.com/crustyrustacean/actix-web-starter.git"
license = "MIT"
publish = false

[profile.release]
lto = true         
codegen-units = 1   
strip = true        
panic = "abort"     

[profile.dev]
debug = true        

[profile.dev.package."*"]
opt-level = 2
